[build-system]
requires = ["setuptools", "pybind11>=2.11", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "mdplib"
version = "1.0.0"
description = "Library of algorithms for infinite-horizon, discounted Markov Decision Processes, with a C++ core"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Lucca Giannelli", email = "lucca.giannelli@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "pandas", "pybind11>=2.11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Repository = "https://github.com/LuccaGiannelli/mdplib"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdp*"]
