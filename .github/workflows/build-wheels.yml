name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "mdp/**"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/build-wheels.yml"
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Safety net: a genuine hang should fail fast and visibly instead of
    # running until the (much longer) GitHub Actions default job timeout.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (arm64) only. Intel macOS (macos-13) is
        # intentionally not built here; users on Intel Macs get the sdist
        # and need a C++17 compiler (Xcode Command Line Tools) to install.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          # manylinux2014's GCC is too old for our C++17 core / recent
          # NumPy; manylinux_2_28 (AlmaLinux 8, GCC 12+) has a current
          # toolchain. Wheels built against it need glibc >= 2.28 (RHEL8 /
          # Ubuntu 18.10 / Debian 10 or newer), which covers essentially
          # every machine still updated today.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14.0"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on tag pushes, never on pull requests or manual test runs.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
